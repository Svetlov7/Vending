<main class="mx-auto w-full max-w-[1400px] px-3 pb-4 sm:px-4 sm:pb-6">
  <div
    class="sticky top-(--app-header-h) z-[5] -mx-3 flex h-14 items-center justify-between gap-3 border-b border-slate-200 bg-white/90 px-3 backdrop-blur sm:-mx-4 sm:px-4"
  >
    <h1 class="min-w-0 truncate text-xl font-bold text-gray-900">Admin Panel</h1>
    <button appButton type="button" size="sm" class="shrink-0" (click)="openProductForm()">
      Add Product
    </button>
  </div>

  <div class="grid grid-cols-1 gap-3 pt-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (product of products(); track product.id) {
      <app-admin-product-card
        [id]="productDomId(product.id)"
        class="scroll-mt-[calc(var(--app-header-h)+4.5rem)] rounded-md"
        [class.animate-product-highlight]="product.id === highlightedId()"
        [product]="product"
        (animationend)="onHighlightEnd($event, product.id)"
        (edit)="openProductForm(product)"
        (remove)="deleteProduct(product)"
      />
    }
  </div>
</main>
